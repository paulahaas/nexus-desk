[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
# Conteúdo de demonstração (textos de macro, títulos de chamado) legitimamente
# ultrapassa o limite de linha; não vale a pena quebrar strings por causa disso.
"tickets/management/commands/seed_demo.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "config",
    "accounts",
    "tickets",
    "classifier",
    "knowledge",
    "assets",
    "dashboard",
    "incidents",
    "checklists",
    "notifications",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=. --cov-report=term-missing --cov-config=.coveragerc"
