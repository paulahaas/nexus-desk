{% extends "base.html" %}
{% block title %}Nova senha — Nexus Desk{% endblock %}
{% block content %}
{% if validlink %}
<h1>Escolha uma nova senha</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Salvar</button>
</form>
{% else %}
<p>Este link de redefinição é inválido ou já expirou.</p>
{% endif %}
{% endblock %}
