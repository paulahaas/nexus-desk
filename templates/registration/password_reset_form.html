{% extends "base_guest.html" %}
{% block title %}Redefinir senha — Nexus Desk{% endblock %}
{% block content %}
<h1 class="mb-1 text-xl font-semibold text-text">Redefinir senha</h1>
<p class="mb-6 text-sm text-text-dim">Informe seu e-mail. Se ele existir na nossa base, enviamos um link de redefinição.</p>
<form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
        <label for="{{ form.email.id_for_label }}" class="mb-1 block text-xs font-medium text-text-dim">E-mail</label>
        <input
            type="email" name="email" id="{{ form.email.id_for_label }}" autofocus required
            class="w-full rounded-[var(--radius-control)] border border-border bg-surface-2 px-3 py-2 text-sm text-text placeholder:text-text-faint focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent"
        >
    </div>
    <button type="submit" class="btn-primary w-full rounded-[var(--radius-control)] px-4 py-2 text-sm font-medium text-white">
        Enviar e-mail
    </button>
</form>
<p class="mt-4 text-center text-xs">
    <a href="{% url 'login' %}" class="text-text-dim hover:text-accent">Voltar pro login</a>
</p>
{% endblock %}
